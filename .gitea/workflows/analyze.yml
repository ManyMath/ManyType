name: Static analysis
jobs:
  analyze:
    runs-on: manymath-maintenance-linux-x64
    defaults:
      run:
        working-directory: ManyType
    steps:
    - name: Require private primary forge
      env:
        PRIMARY_SERVER: ${{ github.server_url }}
      working-directory: ${{ runner.temp }}
      run: 'test "$PRIMARY_SERVER" = https://git.manymath.com

        rustup run 1.94.0 rustc --version

        dart --version

        flutter --version

        '
    - name: Checkout ManyType
      uses: actions/checkout@v4
      with:
        path: ManyType
    - name: melos bootstrap
      run: timeout --signal=TERM --kill-after=30s 15m flutter pub get --enforce-lockfile
    - name: melos run analyze
      run: timeout --signal=TERM --kill-after=30s 20m ./tool/melos run analyze --no-select
    - name: melos run format-check
      run: timeout --signal=TERM --kill-after=30s 15m ./tool/melos run format-check --no-select
    timeout-minutes: 60
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    - maintenance/**
  pull_request:
    branches:
    - main
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: 1.94.0
  CARGO_HOME: ${{ runner.temp }}/manytype-cargo-${{ github.run_id }}-${{ github.job }}
  CARGO_BUILD_JOBS: '3'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  DASH__SUPPRESS_ANALYTICS: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DO_NOT_TRACK: '1'
  CI: 'true'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
