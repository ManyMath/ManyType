name: manytype
description: ManyType, a cross-platform Any-Sync client built on manyui.
publish_to: none
resolution: workspace
version: 0.1.0

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.5.0
  manytype_cli:
    path: ../../packages/manytype_cli
  manytype_core:
    path: ../../packages/manytype_core
  manyui:
    path: ../../../ManyUI/manyui
  manyui_hooks:
    path: ../../../ManyUI/manyui_hooks
  manyui_riverpod:
    path: ../../../ManyUI/manyui_riverpod

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: false
