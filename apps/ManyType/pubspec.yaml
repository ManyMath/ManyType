name: manytype
description: ManyType, a cross-platform Any-Sync client built on manyui.
publish_to: none
resolution: workspace
version: 0.1.0

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  flutter_hooks: ^0.20.5
  flutter_secure_storage: ^10.3.1
  hooks_riverpod: ^2.5.0
  manytype_cli:
    path: ../../packages/manytype_cli
  manytype_core:
    path: ../../packages/manytype_core
  manytype_protocol:
    path: ../../packages/manytype_protocol
  manyui:
    git:
      url: https://github.com/ManyMath/ManyUI.git
      ref: 88ad8614877b8fd51f79b84376117b37882df11f
      path: manyui
  manyui_hooks:
    git:
      url: https://github.com/ManyMath/ManyUI.git
      ref: 88ad8614877b8fd51f79b84376117b37882df11f
      path: manyui_hooks
  manyui_riverpod:
    git:
      url: https://github.com/ManyMath/ManyUI.git
      ref: 88ad8614877b8fd51f79b84376117b37882df11f
      path: manyui_riverpod

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: false
