name: manytype_core
description: >-
  Key derivation, encryption, signing, ACL, and CRDT object-tree logic for the
  anytype Dart SDK. Pure Dart with no native or storage dependencies.
version: 0.0.2
repository: https://github.com/ManyMath/ManyType/tree/main/packages/manytype_core
issue_tracker: https://github.com/ManyMath/ManyType/issues
topics:
  - anytype
  - crdt
  - cryptography
resolution: workspace
environment:
  sdk: ^3.8.1
dependencies:
  cryptography: ^2.9.0
  convert: ^3.1.0
  bip39_mnemonic: ^4.1.0
  ed25519_hd_key: ^2.3.0
  fixnum: ^1.1.0
  libcompress: ^1.0.0
  pinenacl: ^0.6.0
  protobuf: ^6.0.0
  manytype_protocol: ^0.0.2
dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
