# The anytype QUIC bridge. This directory is the cargokit manifest dir of the
# anytype_flutter plugin, so the crate and its sibling crates under crates/
# ship in the published package. The repository's server workspace in
# ../../../rust depends on these crates by path.
[package]
name = "manytype_quic_ffi"
version = "0.1.0"
rust-version = "1.88"
edition = "2024"
publish = false
license-file = "LICENSE"

[lib]
# cdylib for dart:ffi, staticlib for the iOS and macOS plugin frameworks
# that force-load it, rlib for tests.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
manytype_proto = { path = "crates/manytype_proto" }
manytype_core = { path = "crates/manytype_core" }
manytype_transport = { path = "crates/manytype_transport" }
tokio = { workspace = true }
quinn = { workspace = true }
rustls = { workspace = true }
prost = { workspace = true }
bytes = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
ed25519-dalek = { version = "2", features = ["rand_core"] }
tracing = { workspace = true }
libp2p-identity = { workspace = true, features = ["ed25519", "peerid", "rsa"] }
libp2p-tls = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[workspace]
resolver = "2"
members = [
    ".",
    "crates/manytype_proto",
    "crates/manytype_core",
    "crates/manytype_transport",
]

[workspace.dependencies]
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
hex = "0.4"
bytes = "1"
tokio-util = { version = "0.7", features = ["codec", "rt"] }
futures = "0.3"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rand = "0.9"
libp2p-identity = { version = "0.2.13", default-features = false }
libp2p-tls = "0.6.2"
