[workspace]
resolver = "2"
members = [
    "manytype_proto",
    "manytype_core",
    "manytype_server",
]

[workspace.dependencies]
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
hex = "0.4"
