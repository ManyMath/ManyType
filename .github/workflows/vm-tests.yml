name: VM (dart:io) test suite

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-vm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Verify Rust/cargo toolchain is available
        run: cargo --version

      - name: Activate melos
        run: dart pub global activate melos

      - name: melos bootstrap
        run: dart pub global run melos bootstrap

      - name: melos run test:ci
        run: dart pub global run melos run test:ci --no-select
