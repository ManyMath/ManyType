name: Static analysis

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ManyType
    steps:
      - name: Checkout ManyType
        uses: actions/checkout@v4
        with:
          path: ManyType

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Activate melos
        run: dart pub global activate melos

      - name: melos bootstrap
        run: timeout --signal=TERM --kill-after=30s 15m dart pub global run melos bootstrap

      - name: melos run analyze
        run: timeout --signal=TERM --kill-after=30s 20m dart pub global run melos run analyze --no-select

      - name: melos run format-check
        run: timeout --signal=TERM --kill-after=30s 15m dart pub global run melos run format-check --no-select
