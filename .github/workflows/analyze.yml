name: Static analysis

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ManyType
    steps:
      - name: Checkout ManyType
        uses: actions/checkout@v4
        with:
          path: ManyType

      - name: Require dependency checkout token
        env:
          DEPENDENCY_CHECKOUT_TOKEN: ${{ secrets.DEPENDENCY_CHECKOUT_TOKEN }}
        run: |
          if [ -z "${DEPENDENCY_CHECKOUT_TOKEN:-}" ]; then
            echo "DEPENDENCY_CHECKOUT_TOKEN must be a read-only PAT that can clone sneurlax/manyui" >&2
            exit 1
          fi

      - name: Checkout pinned ManyUI
        uses: actions/checkout@v4
        with:
          repository: sneurlax/manyui
          ref: 7d0fc083eff35c2b5c035d4328f5ed2d6845ced2
          path: ManyUI
          token: ${{ secrets.DEPENDENCY_CHECKOUT_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Activate melos
        run: dart pub global activate melos

      - name: melos bootstrap
        run: timeout --signal=TERM --kill-after=30s 15m dart pub global run melos bootstrap

      - name: melos run analyze
        run: timeout --signal=TERM --kill-after=30s 20m dart pub global run melos run analyze --no-select

      - name: melos run format-check
        run: timeout --signal=TERM --kill-after=30s 15m dart pub global run melos run format-check --no-select
