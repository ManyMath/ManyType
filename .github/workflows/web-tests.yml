name: Web (chrome) test suite

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ManyType
    steps:
      - name: Checkout ManyType
        uses: actions/checkout@v4
        with:
          path: ManyType

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Chrome is available
        run: google-chrome --version

      - name: Activate melos
        run: dart pub global activate melos

      - name: melos bootstrap
        run: timeout --signal=TERM --kill-after=30s 15m dart pub global run melos bootstrap

      - name: melos run test:web
        run: timeout --signal=TERM --kill-after=30s 60m dart pub global run melos run test:web --no-select
