name: ManyType Flutter Product

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app-site:
    name: App tests and canonical web distribution
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ManyType
        uses: actions/checkout@v4
        with:
          path: ManyType
      - name: Require dependency checkout token
        env:
          DEPENDENCY_CHECKOUT_TOKEN: ${{ secrets.DEPENDENCY_CHECKOUT_TOKEN }}
        run: |
          if [ -z "${DEPENDENCY_CHECKOUT_TOKEN:-}" ]; then
            echo "DEPENDENCY_CHECKOUT_TOKEN must be a read-only PAT that can clone sneurlax/manyui" >&2
            exit 1
          fi
      - name: Checkout pinned ManyUI
        uses: actions/checkout@v4
        with:
          repository: sneurlax/manyui
          ref: e6aa5314b47868ac8d0d8b44474545fed6004226
          path: ManyUI
          token: ${{ secrets.DEPENDENCY_CHECKOUT_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve app dependencies
        working-directory: ManyType/apps/ManyType
        run: flutter pub get
      - name: Check app formatting
        working-directory: ManyType
        run: >-
          dart format --output none --set-exit-if-changed
          apps/ManyType/lib apps/ManyType/test
      - name: Analyze canonical app
        working-directory: ManyType/apps/ManyType
        run: flutter analyze
      - name: Test canonical app
        working-directory: ManyType/apps/ManyType
        run: timeout --signal=TERM --kill-after=30s 20m flutter test
      - name: Build canonical site and app
        working-directory: ManyType
        run: >-
          timeout --signal=TERM --kill-after=30s 25m
          ./apps/ManyType.com/tool/build_web.sh
      - name: Verify canonical distribution
        working-directory: ManyType
        run: ./apps/ManyType.com/tool/verify_web_dist.sh
      - name: Upload canonical distribution
        uses: ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        with:
          name: manytype-web
          path: ManyType/apps/ManyType.com/build/dist
          if-no-files-found: error
          retention-days: 7
