name: manytype_workspace
publish_to: none
environment:
  sdk: ">=3.5.3 <4.0.0"
workspace:
  - packages/manytype_protocol
  - packages/manytype_core
  - packages/manytype_cli
  - apps/ManyType
dev_dependencies:
  melos: ^7.5.0

# The ManyType app (apps/ManyType) builds on the manyui library, developed in
# lockstep from a sibling checkout (../ManyUI). manyui is not yet published,
# so its packages' hosted self-references are overridden to the sibling paths.
dependency_overrides:
  manyui:
    path: ../ManyUI/manyui
melos:
  name: manytype
  packages:
    - packages/**
  sdkPath: auto
  command:
    bootstrap:
      runPubGetInParallel: true
  scripts:
    test:
      run: dart test
      exec:
        concurrency: 1
      packageFilters:
        dirExists: test
    test:web:
      run: |
        if [ -f tool/fetch_web_test_assets.dart ]; then
          dart run tool/fetch_web_test_assets.dart
        fi
        dart test -p chrome -j 1
      description: Fetch web test assets (if any) and run the chrome test suite for every package with tests.
      exec:
        concurrency: 1
      packageFilters:
        dirExists: test
    test:ci:
      run: dart test --exclude-tags=round_trip -j 1
      description: |
        Run the VM test suite excluding tests tagged `round_trip` (docker
        any-sync oracle / live manytype_server integration tests). Every
        other VM test either has no live-infra dependency or self-skips via
        an env-var gate (MANYTYPE_LIVE_SERVER_TESTS, MANYTYPE_RUN_PHASE*)
        when its prerequisites aren't set up, so this target is safe to run
        in a bare CI runner with no docker/server/FFI setup. `-j 1` is
        required: some harness tests (phase38/phase39) build and start a
        real manytype_server themselves and race on port allocation under
        concurrent test-file execution (`-j 4` reproduced intermittent
        "Address already in use" failures; `-j 1` did not).
        The Flutter product package is intentionally excluded here because
        its `dart:ui` tests run with `flutter test` in product-web.yml.
      exec:
        concurrency: 1
      packageFilters:
        dirExists: test
        ignore:
          - manytype
    test:oracle:
      run: dart test --tags=round_trip -j 1
      description: |
        Run only the `round_trip`-tagged VM tests (docker any-sync oracle /
        live manytype_server integration tests). Requires the self-hosted
        oracle stack to be up (`docker/any-sync`: `make start`), the release
        FFI library built (`cargo build -p manytype_quic_ffi --release`),
        and `LD_LIBRARY_PATH` including `rust/target/release`. See
        `.github/workflows/oracle-tests.yml`. Scoped to `manytype_cli`: it's
        the only package with any `round_trip`-tagged tests, and `dart test
        --tags=` errors out (exit 79) in packages with zero matches.
      exec:
        concurrency: 1
      packageFilters:
        scope: manytype_cli
    analyze:
      run: dart analyze .
      exec:
        concurrency: 1
    format-check:
      run: dart format --output=none --set-exit-if-changed .
      description: Fail if any file isn't formatted per `dart format`.
      exec:
        concurrency: 1
    codegen:
      run: npx @bufbuild/buf generate
      description: Generate Dart and Rust protobuf types from proto/
